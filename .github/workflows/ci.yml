name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q api server.py classifiers
      - name: Backend tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate dashboard JavaScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('dashboard/index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!match) throw new Error('dashboard script not found');
          fs.writeFileSync('/tmp/bsc-dashboard.js', match[1]);
          NODE
          node --check /tmp/bsc-dashboard.js


  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: agent/go.sum
      - name: Agent tests
        working-directory: agent
        run: go test ./...
      - name: Linux build
        working-directory: agent
        run: go build ./...
      - name: Windows cross-build
        working-directory: agent
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -o /tmp/bsc-dlp-agent.exe .
