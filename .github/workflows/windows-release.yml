name: Build Windows Community Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: agent/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Build portable release
        shell: powershell
        run: |
          $version = "0.6.8"
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = ("${{ github.ref_name }}") -replace '^v',''
          }
          .\scripts\windows\Build-Community-Release.ps1 -Version $version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BSC-DLP-Community-Windows-x64
          path: build/community/BSC-DLP-Community-*-Windows-x64.zip

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/community/BSC-DLP-Community-*-Windows-x64.zip
